<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="settingsTitle">设置</title>
  <link rel="stylesheet" href="../../styles/common.css">
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <div class="settings-container">
    <!-- 头部 -->
    <header class="settings-header">
      <h1 data-i18n="settingsTitle">设置</h1>
    </header>

    <main class="settings-main">
      <!-- API 设置 -->
      <section class="settings-section">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
          </svg>
          <span data-i18n="apiSettings">API 设置</span>
        </h2>
        <div class="section-content">
          <div class="form-group">
            <label for="apiEndpoint" data-i18n="apiEndpoint">API 端点</label>
            <input type="url" id="apiEndpoint" class="input" data-i18n-placeholder="apiEndpointPlaceholder">
            <p class="form-hint">支持 OpenAI 兼容格式的 API 端点</p>
          </div>
          <div class="form-group">
            <label for="apiKey" data-i18n="apiKey">API 密钥</label>
            <div class="input-with-action">
              <input type="password" id="apiKey" class="input" data-i18n-placeholder="apiKeyPlaceholder">
              <button type="button" class="btn btn-ghost btn-icon" id="toggleApiKey" title="显示/隐藏">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="form-group">
            <label for="apiModel">模型名称</label>
            <input type="text" id="apiModel" class="input" placeholder="gpt-3.5-turbo">
            <p class="form-hint">留空则使用默认模型</p>
          </div>
          <div class="form-actions">
            <button type="button" class="btn btn-secondary" id="testApi">测试连接</button>
          </div>
        </div>
      </section>

      <!-- 防火墙白名单 -->
      <section class="settings-section">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          <span data-i18n="firewallWhitelist">防火墙白名单</span>
        </h2>
        <div class="section-content">
          <p class="section-desc" data-i18n="firewallWhitelistDesc">以下域名不会被标记为失效（每行一个域名）</p>
          <div class="form-group">
            <textarea id="firewallWhitelist" class="input textarea" rows="8" placeholder="google.com&#10;youtube.com&#10;twitter.com"></textarea>
          </div>
        </div>
      </section>

      <!-- 外观设置 -->
      <section class="settings-section">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <span data-i18n="appearance">外观</span>
        </h2>
        <div class="section-content">
          <div class="form-group">
            <label data-i18n="darkMode">深色模式</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="darkMode" value="auto" checked>
                <span>跟随系统</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="darkMode" value="light">
                <span>浅色</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="darkMode" value="dark">
                <span>深色</span>
              </label>
            </div>
          </div>
          <div class="form-group">
            <label data-i18n="language">语言</label>
            <div class="radio-group">
              <label class="radio-label">
                <input type="radio" name="language" value="auto" checked>
                <span>跟随系统</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="language" value="zh_CN">
                <span>中文</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="language" value="en">
                <span>English</span>
              </label>
            </div>
          </div>
        </div>
      </section>

      <!-- 关于 -->
      <section class="settings-section">
        <h2 class="section-title">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <path d="M12 16v-4M12 8h.01"></path>
          </svg>
          <span>关于</span>
        </h2>
        <div class="section-content">
          <div class="about-info">
            <div class="about-row">
              <span class="about-label">版本</span>
              <span class="about-value" id="version">1.0.0</span>
            </div>
            <div class="about-row">
              <span class="about-label">作者</span>
              <span class="about-value">Bookmark Tree Team</span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 底部保存栏 -->
    <footer class="settings-footer">
      <div class="footer-content">
        <span id="saveStatus"></span>
        <button type="button" class="btn btn-primary" id="saveSettings" data-i18n="save">保存</button>
      </div>
    </footer>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display: none;"></div>

  <script src="settings.js"></script>
</body>
</html>
