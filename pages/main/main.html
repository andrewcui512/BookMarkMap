<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Tree</title>
  <link rel="stylesheet" href="../../styles/common.css">
  <link rel="stylesheet" href="../../styles/tree.css">
  <link rel="stylesheet" href="main.css">
</head>
<body>
  <div class="app-container">
    <!-- 侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1 class="app-title">📚 Bookmark Tree</h1>
      </div>

      <div class="sidebar-search">
        <div class="search-box">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="M21 21l-4.35-4.35"></path>
          </svg>
          <input type="text" class="input" id="searchInput" data-i18n-placeholder="searchPlaceholder">
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-item active" data-view="all">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
            <polyline points="9 22 9 12 15 12 15 22"></polyline>
          </svg>
          <span>全部书签</span>
        </div>
        <div class="nav-item" data-view="recent">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <span>最近添加</span>
        </div>
        <div class="nav-item" data-view="invalid">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
          <span>已失效</span>
        </div>
      </nav>

      <div class="sidebar-footer">
        <button class="btn btn-ghost" id="btnSettings">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <span data-i18n="settings">设置</span>
        </button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 工具栏 -->
      <header class="toolbar">
        <div class="toolbar-left">
          <h2 class="view-title" id="viewTitle">全部书签</h2>
          <span class="bookmark-count" id="bookmarkCount"></span>
        </div>
        <div class="toolbar-right">
          <button class="btn btn-secondary" id="btnNewFolder">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path>
              <line x1="12" y1="11" x2="12" y2="17"></line>
              <line x1="9" y1="14" x2="15" y2="14"></line>
            </svg>
            <span data-i18n="newFolder">新建文件夹</span>
          </button>
          <button class="btn btn-secondary" id="btnCheckLinks">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
              <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
            </svg>
            <span data-i18n="checkLinks">检测失效链接</span>
          </button>
          <button class="btn btn-primary" id="btnAiClassify">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2a2 2 0 0 1 2 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 0 1 7 7h1a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-1v1a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-1H2a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1h1a7 7 0 0 1 7-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 0 1 2-2z"></path>
            </svg>
            <span data-i18n="aiClassify">AI 智能分类</span>
          </button>
        </div>
      </header>

      <!-- 书签树区域 -->
      <div class="content-area">
        <div id="bookmarkTree" class="bookmark-tree">
          <!-- 书签树渲染位置 -->
        </div>

        <!-- 加载状态 -->
        <div id="loadingState" class="loading-state" style="display: none;">
          <div class="spinner"></div>
          <span data-i18n="loading">加载中...</span>
        </div>

        <!-- 空状态 -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-state-icon">📚</div>
          <div class="empty-state-title" data-i18n="noBookmarks">暂无书签</div>
        </div>

        <!-- 搜索无结果 -->
        <div id="noResultsState" class="empty-state" style="display: none;">
          <div class="empty-state-icon">🔍</div>
          <div class="empty-state-title" data-i18n="noResults">未找到匹配结果</div>
        </div>
      </div>
    </main>
  </div>

  <!-- 右键菜单 -->
  <div id="contextMenu" class="context-menu" style="display: none;">
    <div class="context-menu-item" data-action="open">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      <span data-i18n="openInNewTab">在新标签页打开</span>
    </div>
    <div class="context-menu-item" data-action="copy">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
      </svg>
      <span data-i18n="copyUrl">复制链接</span>
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item" data-action="rename">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
      </svg>
      <span data-i18n="rename">重命名</span>
    </div>
    <div class="context-menu-item" data-action="move">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"></path>
      </svg>
      <span data-i18n="move">移动到...</span>
    </div>
    <div class="context-menu-divider"></div>
    <div class="context-menu-item danger" data-action="delete">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="3 6 5 6 21 6"></polyline>
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
      </svg>
      <span data-i18n="delete">删除</span>
    </div>
  </div>

  <!-- 模态框：新建文件夹 -->
  <div id="modalNewFolder" class="modal" style="display: none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>新建文件夹</h3>
        <button class="btn btn-icon btn-ghost modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label for="newFolderName">文件夹名称</label>
          <input type="text" id="newFolderName" class="input" placeholder="输入文件夹名称">
        </div>
        <div class="form-group">
          <label for="newFolderParent">创建位置</label>
          <select id="newFolderParent" class="input"></select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary modal-cancel" data-i18n="cancel">取消</button>
        <button class="btn btn-primary" id="confirmNewFolder" data-i18n="confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 模态框：移动书签 -->
  <div id="modalMove" class="modal" style="display: none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      <div class="modal-header">
        <h3>移动到...</h3>
        <button class="btn btn-icon btn-ghost modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="folderTree" class="folder-tree"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary modal-cancel" data-i18n="cancel">取消</button>
        <button class="btn btn-primary" id="confirmMove" data-i18n="confirm">确定</button>
      </div>
    </div>
  </div>

  <!-- 模态框：链接检测结果 -->
  <div id="modalLinkCheck" class="modal" style="display: none;">
    <div class="modal-backdrop"></div>
    <div class="modal-content modal-lg">
      <div class="modal-header">
        <h3>链接检测结果</h3>
        <button class="btn btn-icon btn-ghost modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <div id="linkCheckProgress" class="progress-bar" style="display: none;">
          <div class="progress-track">
            <div class="progress-fill" id="progressFill"></div>
          </div>
          <span class="progress-text" id="progressText">0%</span>
        </div>
        <div id="linkCheckResults" class="link-check-results"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary modal-cancel" data-i18n="cancel">取消</button>
        <button class="btn btn-primary" id="confirmMoveInvalid" data-i18n="moveToInvalid">移动到已失效文件夹</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" style="display: none;"></div>

  <script src="../../scripts/bookmark-manager.js"></script>
  <script src="../../scripts/link-checker.js"></script>
  <script src="../../scripts/tree-renderer.js"></script>
  <script src="main.js"></script>
</body>
</html>
