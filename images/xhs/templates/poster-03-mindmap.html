<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookMarkMap · Mind Map</title>
    <style>
      :root{
        --bg0:#f8fafc;
        --bg1:#f1f5f9;
        --ink:#0f172a;
        --muted:#334155;
        --muted2:#64748b;
        --primary:#4f46e5;
        --pink:#ec4899;
        --chip:#0ea5e9;
        --ok:#10b981;
        --card:#ffffff;
        --border:rgba(15,23,42,.10);
        --shadow:0 22px 70px rgba(2,6,23,.14);
        --shadow2:0 10px 28px rgba(2,6,23,.12);
      }

      html,body{
        margin:0;
        padding:0;
        width:1080px;
        height:1440px;
        overflow:hidden;
        font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"Arial Unicode MS","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      }

      .page{
        width:100%;
        height:100%;
        background:
          radial-gradient(920px 520px at 14% 8%, rgba(236,72,153,.16), transparent 60%),
          radial-gradient(760px 440px at 92% 18%, rgba(79,70,229,.18), transparent 62%),
          linear-gradient(135deg, var(--bg0), var(--bg1));
        position:relative;
        box-sizing:border-box;
        padding:64px 60px 52px;
      }

      .badge{
        display:inline-flex;
        align-items:center;
        gap:10px;
        padding:10px 14px;
        border:1px solid rgba(236,72,153,.25);
        background:rgba(255,255,255,.70);
        color:rgba(236,72,153,1);
        border-radius:999px;
        font-weight:800;
        font-size:18px;
        letter-spacing:.2px;
        backdrop-filter: blur(8px);
      }

      h1{
        margin:18px 0 8px;
        font-size:72px;
        line-height:1.05;
        letter-spacing:-1px;
        color:var(--ink);
      }

      .sub{
        font-size:28px;
        color:var(--muted);
        margin:0 0 26px;
        line-height:1.35;
      }

      .shot{
        width:960px;
        margin-top:10px;
        background:var(--card);
        border:1px solid var(--border);
        border-radius:28px;
        box-shadow:var(--shadow);
        overflow:hidden;
      }
      .shot img{
        width:100%;
        display:block;
      }
      .shot-footer{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:14px 18px;
        border-top:1px solid var(--border);
        background:linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.98));
        color:var(--muted2);
        font-size:18px;
      }

      .chips{
        display:flex;
        gap:14px;
        margin-top:26px;
        flex-wrap:wrap;
      }
      .chip{
        padding:12px 16px;
        border-radius:999px;
        color:#fff;
        font-weight:800;
        font-size:22px;
        box-shadow:var(--shadow2);
      }
      .chip.primary{ background:linear-gradient(135deg, #4f46e5, #7c3aed); }
      .chip.blue{ background:linear-gradient(135deg, #0ea5e9, #2563eb); }
      .chip.ok{ background:linear-gradient(135deg, #10b981, #059669); }

      .foot{
        position:absolute;
        left:60px;
        right:60px;
        bottom:40px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        color:var(--muted2);
        font-size:18px;
      }
      .brand{
        font-weight:800;
        color:rgba(15,23,42,.78);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="badge">Mind Map View</div>
      <h1>书签一眼看清</h1>
      <p class="sub">把层级关系“画出来”：缩放、平移、拖拽整理，支持横向/纵向布局。</p>

      <div class="shot" aria-label="思维导图截图">
        <img src="../../bookmarkmap思维导图页.png" alt="BookMarkMap 思维导图" />
        <div class="shot-footer">
          <span>思维导图 · 更适合全局梳理与整理</span>
          <span class="brand">BookMarkMap v1</span>
        </div>
      </div>

      <div class="chips">
        <div class="chip primary">缩放/平移</div>
        <div class="chip blue">拖拽移动</div>
        <div class="chip ok">快速定位</div>
      </div>

      <div class="foot">
        <span>Built with vibecoding</span>
        <span>Chrome Extension · Local-first</span>
      </div>
    </div>
  </body>
</html>
