<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookMarkMap · AI Search</title>
    <style>
      :root{
        --bg0:#f8fafc;
        --bg1:#ecfeff;
        --ink:#0f172a;
        --muted:#334155;
        --muted2:#64748b;
        --primary:#4f46e5;
        --aqua:#06b6d4;
        --chip:#0ea5e9;
        --ok:#10b981;
        --card:#ffffff;
        --border:rgba(15,23,42,.10);
        --shadow:0 22px 70px rgba(2,6,23,.14);
        --shadow2:0 10px 28px rgba(2,6,23,.12);
      }

      html,body{
        margin:0;
        padding:0;
        width:1080px;
        height:1440px;
        overflow:hidden;
        font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"Arial Unicode MS","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
      }

      .page{
        width:100%;
        height:100%;
        background:
          radial-gradient(880px 520px at 14% 6%, rgba(6,182,212,.18), transparent 60%),
          radial-gradient(760px 440px at 92% 18%, rgba(79,70,229,.18), transparent 62%),
          linear-gradient(135deg, var(--bg0), var(--bg1));
        position:relative;
        box-sizing:border-box;
        padding:64px 60px 52px;
      }

      .row{
        display:flex;
        align-items:flex-end;
        justify-content:space-between;
        gap:18px;
      }

      .badge{
        display:inline-flex;
        align-items:center;
        gap:10px;
        padding:10px 14px;
        border:1px solid rgba(6,182,212,.26);
        background:rgba(255,255,255,.70);
        color:rgba(6,182,212,1);
        border-radius:999px;
        font-weight:800;
        font-size:18px;
        letter-spacing:.2px;
        backdrop-filter: blur(8px);
      }

      h1{
        margin:18px 0 8px;
        font-size:72px;
        line-height:1.05;
        letter-spacing:-1px;
        color:var(--ink);
      }

      .sub{
        font-size:28px;
        color:var(--muted);
        margin:0 0 26px;
        line-height:1.35;
      }

      .note{
        color:var(--muted2);
        font-size:18px;
        font-weight:600;
        white-space:nowrap;
      }

      .shot{
        width:960px;
        margin-top:10px;
        background:var(--card);
        border:1px solid var(--border);
        border-radius:28px;
        box-shadow:var(--shadow);
        overflow:hidden;
      }
      .shot img{
        width:100%;
        display:block;
      }
      .shot-footer{
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:14px 18px;
        border-top:1px solid var(--border);
        background:linear-gradient(180deg, rgba(255,255,255,.86), rgba(255,255,255,.98));
        color:var(--muted2);
        font-size:18px;
      }

      .chips{
        display:flex;
        gap:14px;
        margin-top:26px;
        flex-wrap:wrap;
      }
      .chip{
        padding:12px 16px;
        border-radius:999px;
        color:#fff;
        font-weight:800;
        font-size:22px;
        box-shadow:var(--shadow2);
      }
      .chip.primary{ background:linear-gradient(135deg, #4f46e5, #7c3aed); }
      .chip.aqua{ background:linear-gradient(135deg, #06b6d4, #0ea5e9); }
      .chip.ok{ background:linear-gradient(135deg, #10b981, #059669); }

      .foot{
        position:absolute;
        left:60px;
        right:60px;
        bottom:40px;
        display:flex;
        justify-content:space-between;
        align-items:center;
        color:var(--muted2);
        font-size:18px;
      }
      .brand{
        font-weight:800;
        color:rgba(15,23,42,.78);
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="row">
        <div>
          <div class="badge">AI Search · Kimi / OpenAI compatible</div>
          <h1>用一句话找书签</h1>
          <p class="sub">不需要记标题、不需要翻目录：AI 语义检索返回相关度评分与理由。</p>
        </div>
        <div class="note">首次使用需按需授权站点访问权限</div>
      </div>

      <div class="shot" aria-label="AI 搜索结果截图">
        <img src="../../bookmarkmap首页ai搜索结果展示.png" alt="BookMarkMap AI 搜索结果" />
        <div class="shot-footer">
          <span>AI 检索结果 · 更全召回（分块扫描）</span>
          <span class="brand">BookMarkMap v1</span>
        </div>
      </div>

      <div class="chips">
        <div class="chip primary">语义匹配</div>
        <div class="chip aqua">相关度评分</div>
        <div class="chip ok">理由解释</div>
      </div>

      <div class="foot">
        <span>适合：收藏很多但“找不到”的人</span>
        <span>Built with vibecoding</span>
      </div>
    </div>
  </body>
</html>
