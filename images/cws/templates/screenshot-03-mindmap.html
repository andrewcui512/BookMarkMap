<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookMarkMap · Mind Map (CWS)</title>
    <link rel="stylesheet" href="./_base.css" />
    <style>
      html,body{width:1280px;height:800px;}
      .bg{
        background:
          radial-gradient(900px 460px at 14% 8%, rgba(236,72,153,.14), transparent 60%),
          radial-gradient(740px 420px at 92% 18%, rgba(79,70,229,.14), transparent 62%),
          linear-gradient(135deg, var(--bg0), #f1f5f9);
      }
      .pill{ border-color: rgba(236,72,153,.26); color: rgba(236,72,153,1); }
    </style>
  </head>
  <body>
    <div class="bg">
      <div class="wrap">
        <div class="header">
          <div>
            <div class="pill">Mind Map View</div>
            <div class="title">书签结构可视化</div>
            <p class="subtitle">缩放、平移、拖拽整理；支持横向/纵向布局快速梳理。</p>
          </div>
          <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:flex-end;">
            <div class="pill gray">Pan/Zoom</div>
            <div class="pill gray">Drag & Drop</div>
          </div>
        </div>

        <div class="shot" aria-label="思维导图截图（演示）">
          <img src="../../bookmarkmap思维导图页.png" alt="BookMarkMap 思维导图" />
        </div>

        <div class="footer">
          <span>思维导图视图：更适合全局整理与重构分类</span>
          <span class="brand">BookMarkMap</span>
        </div>
      </div>
    </div>
  </body>
</html>
