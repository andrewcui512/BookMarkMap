<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BookMarkMap · Promo 440×280</title>
    <style>
      html,body{width:440px;height:280px;margin:0;overflow:hidden;}
      body{
        background:
          radial-gradient(320px 200px at 18% 20%, rgba(79,70,229,.24), transparent 60%),
          radial-gradient(260px 180px at 86% 26%, rgba(6,182,212,.18), transparent 62%),
          linear-gradient(135deg, #f8fafc, #eef2ff);
        font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Helvetica,Arial,"Arial Unicode MS","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
        display:flex;
        align-items:center;
        justify-content:center;
      }
      .card{
        width:388px;
        height:210px;
        background:rgba(255,255,255,.82);
        border:1px solid rgba(15,23,42,.10);
        border-radius:18px;
        box-shadow:0 18px 52px rgba(2,6,23,.14);
        padding:18px 18px 16px;
        box-sizing:border-box;
        display:flex;
        flex-direction:column;
        justify-content:space-between;
      }
      .pill{
        display:inline-flex;
        align-items:center;
        gap:8px;
        padding:6px 10px;
        border-radius:999px;
        border:1px solid rgba(79,70,229,.28);
        color:#4f46e5;
        font-weight:900;
        font-size:12px;
      }
      .name{
        font-size:34px;
        letter-spacing:-.6px;
        font-weight:1000;
        color:#0f172a;
        margin:4px 0 0;
      }
      .desc{
        margin:0;
        color:#334155;
        font-size:14px;
        line-height:1.25;
        font-weight:700;
      }
      .chips{display:flex;gap:8px;flex-wrap:wrap;}
      .chip{
        font-size:12px;
        color:#fff;
        font-weight:900;
        padding:6px 10px;
        border-radius:999px;
      }
      .chip.p{background:linear-gradient(135deg,#4f46e5,#7c3aed);}
      .chip.c{background:linear-gradient(135deg,#06b6d4,#0ea5e9);}
      .chip.g{background:linear-gradient(135deg,#10b981,#059669);}
    </style>
  </head>
  <body>
    <div class="card">
      <div class="pill">Built with vibecoding · v1</div>
      <div>
        <div class="name">BookMarkMap</div>
        <p class="desc">树状 + 思维导图管理书签，支持 AI 语义检索与失效检测。</p>
      </div>
      <div class="chips">
        <span class="chip p">Mind Map</span>
        <span class="chip c">AI Search</span>
        <span class="chip g">Link Check</span>
      </div>
    </div>
  </body>
</html>
