name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version label for the zip (e.g. v1.1.0)."
        required: false
        default: "dev"

permissions:
  contents: write

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Package dist
        run: |
          set -euxo pipefail
          ZIP_NAME="bookmark-map-${VERSION}.zip"
          cd dist
          zip -r "../${ZIP_NAME}" .
          cd ..
          sha256sum "${ZIP_NAME}" > "${ZIP_NAME}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bookmark-map-${{ env.VERSION }}
          path: |
            bookmark-map-${{ env.VERSION }}.zip
            bookmark-map-${{ env.VERSION }}.zip.sha256

      - name: Publish GitHub Release (tag only)
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bookmark-map-${{ env.VERSION }}.zip
            bookmark-map-${{ env.VERSION }}.zip.sha256

