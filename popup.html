<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Tree</title>
  <style>
    body { width: 380px; min-height: 500px; font-family: system-ui, sans-serif; }
    #static-loading { padding: 20px; text-align: center; color: #666; }
  </style>
</head>
<body>
  <div id="root">
    <div id="static-loading">
      <h2 style="color: #2196f3;">正在初始化...</h2>
      <p>如果您一直看到此页面，说明 JavaScript 没有成功加载。</p>
      <p style="font-size: 12px; line-height: 1.6; margin-top: 12px;">
        调试提示：请确认在 <code>chrome://extensions/</code> 中加载的是构建产物目录 <code>dist/</code>（先运行
        <code>npm run dev</code> 或 <code>npm run build</code>）。
      </p>
    </div>
  </div>
  <script type="module" src="/src/pages/popup/main.tsx"></script>
</body>
</html>
